version: 2

project_name: tinyhutch

# Keep release artifacts away from the local dist/ directory.
dist: .goreleaser

before:
  hooks:
    - go test ./...

builds:
  - id: tinyhutch
    main: ./src
    binary: tinyhutch
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .ShortCommit }}
      - -X main.date={{ .Date }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

# Publish the raw executables directly, without tar.gz archives.
archives:
  - id: binaries
    formats:
      - binary
    # No version in the asset name so /releases/latest/download/ URLs stay stable.
    name_template: "tinyhutch_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: SHA256SUMS

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  prerelease: auto
